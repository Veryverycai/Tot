<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; img-src file: mdfile: data:; font-src file: data:">
  <title>Tot</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>

  <header id="topbar">
    <div id="controls">
      <span id="save-status"></span>
      <button id="save-btn" disabled title="保存当前文档 (Ctrl+S)">保存</button>
      <button id="undo-btn" disabled title="撤销上一步 (Ctrl+Z)">撤销</button>
      <div id="searchbar">
        <input id="search-input" type="text" placeholder="查找（大小写不敏感）">
        <span id="search-count"></span>
        <button id="search-prev" title="上一个 (Shift+Enter)">↑</button>
        <button id="search-next" title="下一个 (Enter)">↓</button>
        <button id="search-close" title="清除 (Esc)">×</button>
      </div>
    </div>
    <select id="style-select" title="渲染风格"></select>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="panel-header" id="tree-header">
        <span>目录浏览</span>
        <button class="panel-toggle" id="tree-toggle" title="折叠 / 展开">▾</button>
      </div>
      <nav id="file-tree"></nav>
      <div class="panel-header" id="outline-header" hidden>
        <span>大纲视图</span>
        <button class="panel-toggle" id="outline-toggle" title="折叠 / 展开">▾</button>
      </div>
      <div id="outline-body" hidden>
        <ul id="outline"></ul>
      </div>
    </aside>
    <div id="sidebar-resizer"></div>
    <article id="content">
      <div id="tabbar" hidden></div>
      <div id="panes" hidden>
        <div id="preview-scroll">
          <div id="viewer" class="markdown-body"></div>
        </div>
      </div>
      <div id="close-confirm" hidden>
        <span>未保存的更改将丢失</span>
        <button id="close-discard">关闭并丢弃</button>
        <button id="close-cancel">取消</button>
      </div>
      <div id="session-restore" hidden>
        <span id="session-restore-text">上次打开了文件</span>
        <button id="session-restore-ok">恢复</button>
        <button id="session-restore-no">忽略</button>
      </div>
      <div id="empty">
        <p>还没有打开目录</p>
        <p class="hint">菜单 文件 → 打开文件夹 (Ctrl+Shift+O)</p>
      </div>
    </article>
  </div>

  <script src="../lib/highlight.min.js"></script>
  <script src="../lib/marked.umd.js"></script>
  <!-- mermaid（5.5 MB）改为首次遇到图表时按需加载：双击冷启动不再为它付出解析时间 -->
  <script src="../lib/turndown.min.js"></script>
  <script src="../lib/turndown-plugin-gfm.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
